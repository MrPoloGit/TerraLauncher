name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (osx-arm64)
        run: |
          dotnet publish TerraLauncher/TerraLauncher.csproj \
            -c Release -r osx-arm64 --self-contained \
            -o ./publish/osx-arm64

      - name: Zip .app bundle
        run: |
          cd ./publish
          zip -r TerraLauncher-macos-arm64.zip TerraLauncher.app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: publish/TerraLauncher-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (linux-x64)
        run: |
          dotnet publish TerraLauncher/TerraLauncher.csproj \
            -c Release -r linux-x64 --self-contained \
            -o ./publish/linux-x64

      - name: Tar Linux build
        run: |
          cd ./publish/linux-x64
          tar czf ../TerraLauncher-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: publish/TerraLauncher-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64)
        run: |
          dotnet publish TerraLauncher/TerraLauncher.csproj `
            -c Release -r win-x64 --self-contained `
            -o ./publish/win-x64

      - name: Zip Windows build
        run: Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./publish/TerraLauncher-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: publish/TerraLauncher-windows-x64.zip

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
