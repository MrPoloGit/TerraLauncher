name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TerraLauncher.sln

      - name: Test
        run: dotnet test TerraLauncher.sln -c Release

      - name: Publish self-contained build
        run: >
          dotnet publish TerraLauncher/TerraLauncher.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip build output
        run: Compress-Archive -Path publish\* -DestinationPath TerraLauncher-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TerraLauncher-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
