name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore TerraLauncher/TerraLauncher.csproj -r ${{ matrix.rid }}
          dotnet restore TerraLauncher.Tests/TerraLauncher.Tests.csproj

      - name: Build (platform-specific compilation check)
        run: dotnet build TerraLauncher/TerraLauncher.csproj -c Release -r ${{ matrix.rid }} --no-restore --no-self-contained

      - name: Test
        run: dotnet test TerraLauncher.Tests/TerraLauncher.Tests.csproj -c Release --logger "trx;LogFileName=test-results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TerraLauncher.Tests/TestResults/test-results.xml
