name: CI

on:
  push:
    branches: [ master, net-upgrade ]
  pull_request:
    branches: [ master, net-upgrade ]
  workflow_dispatch:

jobs:
  build-and-test:
    # WPF/WinForms only build on Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TerraLauncher.sln

      - name: Build
        run: dotnet build TerraLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test TerraLauncher.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
